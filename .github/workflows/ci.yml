name: CI

on:
  push:
  pull_request:

jobs:
  test-3_13:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: pytest -q

  test-3_14:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find available Python version
        id: select-python
        run: |
          echo "Checking if Python 3.14 is available..."
          VERSIONS=$(curl -s https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json)
          if echo "$VERSIONS" | grep -q '"version": "3.14.0"'; then
            echo "Python 3.14.0 is available"
            echo "version=3.14.0" >> $GITHUB_OUTPUT
          elif echo "$VERSIONS" | grep -q '"version": "3.14.0-rc.3"'; then
            echo "Python 3.14.0-rc.3 is available"
            echo "version=3.14.0-rc.3" >> $GITHUB_OUTPUT
          else
            echo "Neither 3.14.0 nor 3.14.0-rc.3 is available"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ steps.select-python.outputs.version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: pytest -q
